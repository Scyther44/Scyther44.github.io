<header class="site-header">
  <div class="brand-block">
    <p class="eyebrow">Portfolio / Resume</p>
    <h1>Simon Yacoub</h1>
    <p class="subtitle">Software Engineer in Training • Public Safety Systems • Full-Stack Development</p>
  </div>

  <nav aria-label="Primary">
    @for (item of sections; track item.id) {
      <button
        type="button"
        class="nav-link"
        [class.is-active]="activeSection === item.id"
        (click)="selectSection(item.id)">
        {{ item.label }}
      </button>
    }
  </nav>
</header>
